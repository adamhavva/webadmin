name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - dev/**
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Specific function to deploy (leave empty for all)'
        required: false
        type: string

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: |
          npm install -g supabase
          supabase version

      - name: Login to Supabase
        run: supabase login --token ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy all Edge Functions
        if: github.event.inputs.function_name == ''
        run: |
          echo "Deploying all Edge Functions..."
          for dir in supabase/functions/*/; do
            func_name=$(basename "$dir")
            echo "Deploying $func_name..."
            supabase functions deploy "$func_name"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy specific function
        if: github.event.inputs.function_name != ''
        run: |
          echo "Deploying function: ${{ github.event.inputs.function_name }}"
          supabase functions deploy ${{ github.event.inputs.function_name }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: List deployed functions
        run: supabase functions list

  deploy-assign-barista:
    name: Deploy assign-barista
    runs-on: ubuntu-latest
    needs: deploy-edge-functions
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: |
          npm install -g supabase

      - name: Login to Supabase
        run: supabase login --token ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy assign-barista function
        run: |
          echo "Deploying assign-barista function..."
          supabase functions deploy assign-barista --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Checking if assign-barista is deployed..."
          supabase functions list | grep assign-barista || echo "Function deployed successfully"
